[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "recontrol"
authors = [{ name = "recontrol developers", email = "etaoxing@users.noreply.github.com" }]
description = "A real-time control library for cross-embodiment robot manipulation"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version", "readme"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "opencv-python",
    "scipy",
    "tyro",  # command-line interface
    "zarr",  # data storage
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "pytest-xdist",
]
serializers = [
    "cloudpickle",
    "ormsgpack",
]
# --- nodes ---
cameras = [
    "pyrealsense2==2.54.2.5684; sys_platform != 'darwin'",  # realsense
]
interfaces = [
    "spnav @ https://github.com/cheng-chi/spnav/archive/c1c938ebe3cc542db4685e0d13850ff1abfdb943.tar.gz",  # spacemouse
    "dynamixel-sdk",  # gello
    "gello @ https://github.com/etaoxing/gello_software/archive/82a7e3addb93de93e1696835c5a7feea8831fe85.tar.gz",
]
middlewares = [
    "atomics",  # shm
    "portal",
    "zerorpc",
    "eclipse-zenoh",  # zenoh
    "pyzmq",  # zmq
]
robots = [
    "ur-rtde==1.5.6; sys_platform != 'darwin'",  # ur
    "xarm-python-sdk==1.17.0",  # xarm
]

[tool.setuptools.packages.find]
include = ["recontrol*"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 128
indent-width = 4
extend-exclude = [
    "third_party/",
]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "I",   # isort
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "NPY", # NumPy-specific rules
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLW", # pylint warning
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "E731",  # Do not assign a lambda expression, use a def
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*" = ["PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = [
    "recontrol/_tests",
]
